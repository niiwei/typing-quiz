name: CI

on:
    pull_request:
    push:
        branches: [main]

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "11"
                  cache: maven
            - name: Java tests
              run: ./mvnw -B test
            - uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: npm
                  cache-dependency-path: mcp-server/package-lock.json
            - name: MCP tests
              working-directory: mcp-server
              run: npm ci && npm test
            - name: Browser tests
              run: |
                  python3 -m http.server 8080 --directory src/main/resources/static >/tmp/mindpop-static.log 2>&1 &
                  static_pid=$!
                  trap 'kill "$static_pid"' EXIT
                  npm ci
                  npm run test:browser -- --workers=1
